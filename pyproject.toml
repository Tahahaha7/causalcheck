[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalcheck"
version = "0.1.0"
description = "Pre-flight assumption checks for causal discovery: which methods your data can support, and which outputs to trust."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Taha Bouhoun", email = "bouhountaha@gmail.com" }]
keywords = ["causal discovery", "causal inference", "assumptions", "diagnostics", "LiNGAM", "PC", "FCI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "scikit-learn>=1.2"]

[project.optional-dependencies]
full = ["causal-learn>=0.1.3"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Tahahaha7/causalcheck"
Issues = "https://github.com/Tahahaha7/causalcheck/issues"

[project.scripts]
causalcheck = "causalcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
